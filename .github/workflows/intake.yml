name: Intake submitted offer

# Форма «Suggest an offer» -> ты ставишь метку `approved` -> файл offers/<id>.yml создаётся сам.
on:
  issues:
    types: [labeled]

concurrency:
  group: catalog-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  intake:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Create offer file
        id: intake
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/intake.py

      - name: Commit and close
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.intake.outputs.message }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.intake.outputs.ok }}" = "true" ]; then
            git config user.name "isic-bot"
            git config user.email "isic-bot@users.noreply.github.com"
            git add offers
            git commit -m "feat: offer from issue #${NUM}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
            gh issue comment "$NUM" --body "$MESSAGE"
            gh issue close "$NUM"
            gh workflow run maintain.yml --ref "${GITHUB_REF_NAME}" || true
          else
            gh issue comment "$NUM" --body "${MESSAGE:-Не удалось обработать форму.}"
          fi
